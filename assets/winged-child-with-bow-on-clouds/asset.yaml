# descriptive: find it and understand it
id: winged-child-with-bow-on-clouds
title: Winged child with torch and bow on clouds
description: A naked winged putto sits on a rounded bank of clouds, body turned three-quarter to the viewer and head turned to the right. His raised left hand holds a flaming torch, his right hand holds a bow across his lap, a tubular quiver on a strap lies beside his right leg and a globe rests in the clouds at the lower left. Black ink with hatched shading; the cream paper tone is kept inside the figure and clouds, and the background is transparent.
