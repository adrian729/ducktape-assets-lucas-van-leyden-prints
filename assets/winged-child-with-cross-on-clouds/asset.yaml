# descriptive: find it and understand it
id: winged-child-with-cross-on-clouds
title: Winged child with a cross on clouds
description: A winged child in a loose robe sits on a bank of clouds, seen three-quarter from behind and facing left. The left arm stretches straight out to the left across the face, the right hand holds a tall thin cross on a staff that leans to the upper left, and one bare foot rests on the cloud below. Black ink with hatched shading; the cream paper tone is kept inside the figure, robe and clouds, and the background is transparent.
